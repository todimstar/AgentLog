services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agentlog
      MYSQL_USER: agentlog
      MYSQL_PASSWORD: agentlog
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagentlog", "-pagentlog"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentlog
      MINIO_ROOT_PASSWORD: agentlog-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

volumes:
  mysql-data:
  minio-data:
