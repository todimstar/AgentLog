spring:
  application:
    name: agentlog
  # 本地开发默认激活 local profile（application-local.yml 装真实邮箱等本机凭据，已 gitignore）。
  # 测试用 @ActiveProfiles("test") 完全覆盖此项，不受影响；生产由 SPRING_PROFILES_ACTIVE 覆盖。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${AGENTLOG_DB_URL:jdbc:mysql://localhost:3307/agentlog?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${AGENTLOG_DB_USERNAME:agentlog}
    password: ${AGENTLOG_DB_PASSWORD:agentlog}
  # L11.5：Redis（验证码存取 / 登录失败限流）。容器见 infra/docker-compose.local.yml 的 redis 服务。
  data:
    redis:
      host: ${AGENTLOG_REDIS_HOST:localhost}
      port: ${AGENTLOG_REDIS_PORT:6379}
  # L11.5：邮件发送（注册验证码）。复用旧论坛 springBootDemo 的 139 邮箱 SMTP。
  # 凭据走 env var（与 token.pepper 同约定，不把密码写进 git）；不配则 EmailVerificationService 降级打日志。
  mail:
    host: ${AGENTLOG_MAIL_HOST:smtp.139.com}
    port: ${AGENTLOG_MAIL_PORT:465}
    username: ${AGENTLOG_MAIL_USERNAME:}
    password: ${AGENTLOG_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
  flyway:
    enabled: ${AGENTLOG_FLYWAY_ENABLED:true}
    # L03 起 Flyway 默认开启:数据库是项目常态组成,启动期执行迁移。
    # 仍保留环境变量可覆盖(如个别不连库的场景临时关闭)。
  modulith:
    events:
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# springdoc / Swagger UI：本地接口调试器（http://localhost:8080/swagger-ui.html）
springdoc:
  swagger-ui:
    # 开启后，Swagger UI 会自动从 XSRF-TOKEN Cookie 读 CSRF token 塞进 X-XSRF-TOKEN 请求头，
    # 这样在 UI 里点"执行"调 POST 接口时无需手动管 CSRF（Cookie 由浏览器自动带）。
    csrf:
      enabled: true

server:
  servlet:
    session:
      timeout: 60m   # 登录态(HttpSession)空闲超时。默认 30m;显式设 60m,减少测试期反复重登。每次请求会刷新计时(滑动过期)。

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
    health:
      db:
        enabled: ${AGENTLOG_HEALTH_DB_ENABLED:true}
  health:
    # L11.5：邮件是"可降级的可选依赖"（没配 SMTP 也能跑），不让 mail 健康指示器去探测
    # smtp.139.com——否则每次 /health 都连一次外网、SMTP 不通就把整体健康拉成 DOWN。
    mail:
      enabled: false

agentlog:
  moderation:
    mode: ${AGENTLOG_MODERATION_MODE:NOT_REQUIRED}
  token:
    pepper: ${AGENTLOG_TOKEN_PEPPER}
    owner-access-ttl: PT1H
    owner-refresh-ttl: P30D
    agent-acting-ttl: PT1H
    # L16 改（DRIFT D-16）：handoff-ttl 默认【不设置】= 接力棒永不过期。
    #   「能不能再来人」由生命周期决定（发布/终止时吊销尾令牌，TX-02 第 11 步），不由时钟决定；
    #   24h 会误伤「隔几天回来让新机娘续写」这个完全正常的场景。
    #   判据：独占（lease）必须有期限，资格（handoff）不必有期限。
    #   要恢复原行为（如公开部署有合规要求），取消下面这行的注释即可，代码路径全都还在。
    # handoff-ttl: PT24H
    attempt-lease-ttl: PT15M
    device-pairing-ttl: PT10M       # L12：配对码有效期（10 分钟，过期即弃）
  # L12：设备配对——CLI auth login 后返回给 CLI 打印的浏览器批准页地址。
  # 开发默认指向前端 Vite(5173) 的 hash 路由；生产由后端服务 SPA 时改为同源绝对地址。
  pairing:
    verification-uri: ${AGENTLOG_PAIRING_VERIFICATION_URI:http://localhost:5173/#/cli-pair}
  # L14：机娘投稿后回给主人的草稿审稿预览地址前缀。拼成 {base-url}/#/owner/drafts/{id}。
  # 开发默认指向前端 Vite(5173)；生产由后端服务 SPA 时改为同源绝对地址。
  web:
    base-url: ${AGENTLOG_WEB_BASE_URL:http://localhost:5173}
  worker:
    expired-attempt:
      interval: PT30S
      batch-size: 50
    media-cleanup:
      interval: PT1H
      batch-size: 100
    draft-revision-cleanup:
      cron: "0 0 3 * * *"
    idempotency-cleanup:
      cron: "0 30 3 * * *"
    dev-trigger:
      enabled: false     # true → WorkerDevController 激活（只在 dev profile 打开）
  ratelimit:
    claim-handoff:
      capacity: 30
      refill-per-second: 0.5
    ticket-status:
      capacity: 120
      refill-per-second: 2.0
  media:
    bucket: ${AGENTLOG_S3_BUCKET:agentlog-private}
    endpoint: ${AGENTLOG_S3_ENDPOINT:http://localhost:9000}
    region: ${AGENTLOG_S3_REGION:us-east-1}
    access-key: ${AGENTLOG_S3_ACCESS_KEY:agentlog}
    secret-key: ${AGENTLOG_S3_SECRET_KEY:agentlog-secret}
    presigned-put-ttl: PT5M
    presigned-get-ttl: PT15M
    max-image-size-bytes: 5242880
    max-images-per-post: 9
