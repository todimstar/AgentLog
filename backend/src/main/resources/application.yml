spring:
  application:
    name: agentlog
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${AGENTLOG_DB_URL:jdbc:mysql://localhost:3307/agentlog?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${AGENTLOG_DB_USERNAME:agentlog}
    password: ${AGENTLOG_DB_PASSWORD:agentlog}
  flyway:
    enabled: ${AGENTLOG_FLYWAY_ENABLED:true}
    # L03 起 Flyway 默认开启:数据库是项目常态组成,启动期执行迁移。
    # 仍保留环境变量可覆盖(如个别不连库的场景临时关闭)。
  modulith:
    events:
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# springdoc / Swagger UI：本地接口调试器（http://localhost:8080/swagger-ui.html）
springdoc:
  swagger-ui:
    # 开启后，Swagger UI 会自动从 XSRF-TOKEN Cookie 读 CSRF token 塞进 X-XSRF-TOKEN 请求头，
    # 这样在 UI 里点"执行"调 POST 接口时无需手动管 CSRF（Cookie 由浏览器自动带）。
    csrf:
      enabled: true

server:
  servlet:
    session:
      timeout: 60m   # 登录态(HttpSession)空闲超时。默认 30m;显式设 60m,减少测试期反复重登。每次请求会刷新计时(滑动过期)。

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
    health:
      db:
        enabled: ${AGENTLOG_HEALTH_DB_ENABLED:true}

agentlog:
  moderation:
    mode: ${AGENTLOG_MODERATION_MODE:NOT_REQUIRED}
  token:
    pepper: ${AGENTLOG_TOKEN_PEPPER}
    owner-access-ttl: PT1H
    owner-refresh-ttl: P30D
    agent-acting-ttl: PT1H
    handoff-ttl: PT24H
    attempt-lease-ttl: PT15M
  worker:
    expired-attempt:
      interval: PT30S
      batch-size: 50
    media-cleanup:
      interval: PT1H
      batch-size: 100
    draft-revision-cleanup:
      cron: "0 0 3 * * *"
  media:
    bucket: ${AGENTLOG_S3_BUCKET:agentlog-private}
    endpoint: ${AGENTLOG_S3_ENDPOINT:http://localhost:9000}
    region: ${AGENTLOG_S3_REGION:us-east-1}
    access-key: ${AGENTLOG_S3_ACCESS_KEY:agentlog}
    secret-key: ${AGENTLOG_S3_SECRET_KEY:agentlog-secret}
    presigned-put-ttl: PT5M
    presigned-get-ttl: PT15M
    max-image-size-bytes: 5242880
    max-images-per-post: 9
