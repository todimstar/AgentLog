  <p>陪读的定位是<b>验收，不是启蒙</b>——你已经在黑板课/辩论/施工蓝图里过过一遍设计了，这里看的是「实际长什么样、和蓝图哪里不同、为什么」。

const nav=document.getElementById('nav'), body=document.getElementById('body');
let flat=[];
STOPS.forEach((st,si)=>{
  const h=document.createElement('div');h.className='stop';
  h.innerHTML=`第 ${si+1} 站 · ${st.name}<br><span>${st.why}</span>`;
  nav.appendChild(h);
  st.files.forEach(f=>{
    const i=flat.length; flat.push(f);
    const e=document.createElement('div'); e.className='f'; e.dataset.i=i;
    e.innerHTML=`<span class="tag t-${f.t}">${f.t==='new'?'🆕':f.t==='hot'?'🔴':'🔧'}</span><span class="nm">${f.n}</span>`;
    e.onclick=()=>show(i); nav.appendChild(e);
  });
});
function show(i){
  const f=flat[i];
  document.querySelectorAll('.f').forEach(x=>x.classList.toggle('sel',x.dataset.i==i));
  let h=`<h2>${f.n}</h2><div class="path">${f.p}</div>`;
  h+=`<div class="sec"><div class="lbl">为什么这时候读它</div><div class="val">${f.order}</div></div>`;
  if(f.lines) h+=`<div class="sec"><div class="lbl">直接看这几处（注释里已写透，不重复讲）</div>
     <div class="val"><div class="lines">${f.lines.map(l=>`<span>${l}</span>`).join('')}</div></div></div>`;
  if(f.deep) h+=`<div class="sec hot"><div class="lbl">★ 这个文件里真正难的地方</div><div class="val">${f.deep}</div></div>`;
  if(f.link) h+=`<div class="sec"><div class="lbl">跨文件呼应</div><div class="val">${f.link}</div></div>`;
  const nf=flat[i+1];
  h+=`<div class="nx">${nf?`下一个 → <b>${nf.n}</b>`:'读完了。回讲义 §12 做那 11 道自测题。'}</div>`;
  body.innerHTML=h; body.scrollTop=0;
}
